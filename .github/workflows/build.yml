name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  jekyll:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      # jekyll-github-metadata reads the repo from git only in development; production needs it named
      PAGES_REPO_NWO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Check post front matter
        run: ruby scripts/check_post_metadata.rb

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter --trace

