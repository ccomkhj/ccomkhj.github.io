# The site's sections, in order. One list drives every way into them:
# the taskbar on inner pages (_includes/masthead.html), the shared Start menu
# (_includes/start-menu98.html), the desktop icons and <noscript> list on `/`
# (_layouts/win98_desktop.html), and the /terminal/ <noscript> list.
#
#   title    one name for the page, used everywhere it is linked
#   glyph    emoji shown on icons, Start menu and taskbar buttons
#   window   on the desktop, open this window instead of navigating
#   section  extra URLs that count as "in this section" (posts always count as Writings)
#
# Keep unlisted pages (/learn/german/, /immobilien/, /card/, /qr/) out of this list.
main:
  - title: "Writings"
    url: /writings/
    glyph: "📂"
    section: [/tags/]
  - title: "Portfolio"
    url: /portfolio/
    glyph: "💼"
  - title: "About"
    url: /about/
    glyph: "👤"
    window: system
  - title: "Bookmarks"
    url: /bookmarks/
    glyph: "🌐"
